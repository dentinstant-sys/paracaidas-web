    <!-- ============================================
         JSON-LD · FAQPage (los FAQs del Landing)
         ============================================ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Necesito experiencia previa para saltar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No se requiere ninguna experiencia previa. En el salto tándem vas unido al pecho de un instructor certificado USPA que controla absolutamente todo: la posición, el paracaídas principal, el de reserva y el aterrizaje. Tu única tarea es disfrutar."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuáles son los requisitos físicos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Debes tener mínimo 16 años (los menores de 18 saltan con autorización escrita de sus padres o tutores) y pesar menos de 100 kg. No se permite saltar con condiciones cardíacas no controladas, epilepsia activa, embarazo ni bajo efectos de alcohol o sustancias. Si tienes alguna condición médica específica, consúltanos antes de reservar."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto tiempo dura toda la experiencia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El día del salto dura aproximadamente 4 a 5 horas en total: ~1 hora de inducción y briefing de seguridad, ~45 min de vuelo en avioneta hasta la altura de salto (4.000 m), 60 segundos de caída libre, ~5 min de planeo bajo el paracaídas y el regreso."
          }
        },
        {
          "@type": "Question",
          "name": "¿El transporte desde mi ciudad está incluido?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Los participantes deben llegar al aeropuerto por sus propios medios. Si desean, pueden agregar el adicional de transporte puerta a puerta: los recogemos en la dirección que nos indiquen, los llevamos al aeropuerto y, al finalizar la actividad, los regresamos a la ubicación indicada."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué ropa debo usar el día del salto?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ropa cómoda y deportiva: tenis con suela plana o zapatillas deportivas, pantalón largo o leggins y camiseta. Evita sandalias, tacones, faldas y ropa muy holgada. Nosotros te entregamos el overol de vuelo, casco, gafas y arnés. En temporadas frías lleva una chaqueta delgada."
          }
        },
        {
          "@type": "Question",
          "name": "¿Es apto si tengo miedo a las alturas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "¡Absolutamente! Muchos de nuestros clientes saltan precisamente para superar ese miedo. La caída libre es tan intensa (alcanzas ~200 km/h en segundos) que la percepción de altura desaparece completamente. Tu instructor estará contigo en todo momento. Más del 90% de quienes saltan con miedo quieren repetirlo."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué pasa si el clima no es favorable?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La seguridad es lo primero. Monitoreamos el clima en tiempo real con estaciones meteorológicas locales. Si las condiciones no son ideales, reagendamos sin ningún costo adicional y te avisamos con la mayor anticipación posible para que puedas ajustar tus planes."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo llevar acompañantes que no salten?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "¡Por supuesto! Los acompañantes pueden estar en la pista, ver el despegue de la avioneta y presenciar el aterrizaje en vivo. Es una experiencia muy emocionante también para los espectadores."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo recibo el video y las fotos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Recibirás un enlace digital (Google Drive o WeTransfer) con todo el material en alta resolución. El paquete Esencial se entrega en las primeras 24 horas. El Pro Experience y el Trío incluyen edición profesional y pueden tomar hasta 48 horas. El material es tuyo para siempre."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo cambiar o cancelar mi fecha?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Puedes reagendar sin costo hasta 48 horas antes de tu salto programado. Cancelaciones con menos de 48h de anticipación retienen el 50% del valor como compensación por la operación ya preparada. En caso de cancelación por condiciones climáticas, el 100% del valor queda disponible para reagendar."
          }
        }
      ]
    }
    </script>
